<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TNG CAFE</title>
    <link rel="stylesheet" href="test.css">
</head>
<body>

    <!-- ヘッダー -->
    <header>
        <h1>TNG CAFE</h1>
        <p>心安らぐ一杯をあなたに</p>
        <nav>
            <ul>
                <li><a href="#about">About Us</a></li>
                <li><a href="#menu">Menu</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
        </nav>
    </header>

    <!-- メイン -->
    <main>
        <!-- a: about -->
        <section id="about">
            <h2>About Us</h2>
            <p>TNGCafeは自然の香りに包まれたリラックス空間を提供しています。</p>
            <p>自家焙煎コーヒーと手作りスイーツで、穏やかな時間をお過ごしください。</p>
            <img src="https://picsum.photos" alt="カフェの写真" class="cafe-img">
        </section>

        <!-- a: menu -->
        <section id="menu">
            <h2>Menu</h2>
            <div class="menu-container">
                <div class="menu-card">
                    <img src="https://picsum.photos" alt="コーヒー">
                    <p>ブレンドコーヒー</p>
                </div>
                <div class="menu-card">
                    <img src="https://picsum.photos" alt="ケーキ">
                    <p>ベイクドチーズケーキ</p>
                </div>
                <div class="menu-card">
                    <img src="https://picsum.photos" alt="ラテ">
                    <p>カフェラテ</p>
                </div>
            </div>
        </section>

        <!-- a: contact -->
        <section id="contact">
            <h2>Contact</h2>
            <form>
                <div class="input-item">
                    <label>お名前：</label>
                    <input type="text">
                </div>
                <div class="input-item">
                    <label>メールアドレス：</label>
                    <input type="email">
                </div>
                <div class="input-item">
                    <label>お問い合わせ内容：</label>
                    <textarea rows="4"></textarea>
                </div>
                <button type="submit" class="btn">送信</button>
            </form>
        </section>
    </main>

    <!-- フッター -->
    <footer>
        <p>&copy; 2026 TNG Cafe</p>
    </footer>

</body>
</html>
